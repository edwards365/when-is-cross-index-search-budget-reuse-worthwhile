[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narhnsw"
version = "0.1.0"
description = "Reproducible feasibility experiments for navigation-aware resistance graph rewiring"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "psutil>=5.9,<8",
  "hnswlib==0.8.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "seaborn>=0.13,<1", "statsmodels>=0.14,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

