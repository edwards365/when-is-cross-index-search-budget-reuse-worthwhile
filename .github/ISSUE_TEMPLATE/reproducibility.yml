name: Reproducibility issue
description: Report a problem checking or reconstructing the published artifact.
title: "[reproduce] "
body:
  - type: markdown
    attributes:
      value: Please use the artifact runbook and remove private paths, credentials, and restricted data from logs.
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: artifact-response-v1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, dependency versions, and input archive version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private host details, and restricted data from this report.
          required: true
