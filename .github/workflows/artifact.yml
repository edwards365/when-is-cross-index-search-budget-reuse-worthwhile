name: artifact-consistency
on:
  push:
    paths: ["artifact/**", ".github/workflows/artifact.yml"]
  pull_request:
    paths: ["artifact/**", ".github/workflows/artifact.yml"]
permissions:
  contents: read
jobs:
  saved-output-and-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r artifact/requirements-analysis.txt
      - run: python artifact/check_saved_results.py
      - run: python -m unittest discover -s artifact -p "test_*.py"
      - run: python artifact/reproduce_paper.py --output paper-reconstruction
  cache-adapter-synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r artifact/original_execution/portable_cache/requirements.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_cache -p "test_cache_stage.py" -v
  fresh-input-synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r artifact/original_execution/portable_fresh_inputs/requirements.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_fresh_inputs -p "test_prepare_inputs.py" -v
      - run: python artifact/original_execution/portable_fresh_inputs/prepare_inputs.py check-registry
  truth-native-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_truth/requirements.txt
      - run: python artifact/original_execution/portable_truth/run_truth.py check-native
      - run: python -m unittest discover -s artifact/original_execution/portable_truth -p "test_truth.py" -v
  profile-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest discover -s artifact/original_execution/portable_profiles -p "test_profiles.py" -v
      - run: python artifact/original_execution/portable_profiles/native_entry.py --output "$RUNNER_TEMP/profile-native-test" --authorize-build-and-synthetic-tests
  profile-array-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest discover -s artifact/original_execution/portable_arrays -p "test_arrays.py" -v
  graph-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_graphs/requirements-build.txt
      - run: python -m pip install --no-build-isolation --no-deps -r artifact/original_execution/portable_graphs/requirements-native.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_graphs -p "test_graphs.py" -v
      - run: python -m unittest discover -s artifact/original_execution/portable_reload -p "test_reload.py" -v
  policy-lock-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_policy/requirements.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_policy -p "test_policy.py" -v
  baseline-lock-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_baselines/requirements.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_baselines -p "test_baselines.py" -v
  timing-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest discover -s artifact/original_execution/portable_timing -p "test_timing.py" -v
  recovery-100k-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_recovery_100k/requirements.txt
      - run: python -m pip install -r artifact/original_execution/portable_truth/requirements.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_recovery_100k -p "test_recovery.py" -v
  deep-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_deep/requirements.txt
      - run: python -m pip install --no-build-isolation --no-deps -r artifact/original_execution/portable_deep/requirements-native.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_deep -p "test_deep.py" -v
  transfer-and-g1-python-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_ambiguity/requirements.txt
      - run: python -m pip install --no-deps -r artifact/original_execution/portable_transfer_100k/requirements-faiss-native.txt
      - run: python -m unittest discover -s artifact/original_execution/portable_transfer_100k -p "test_transfer.py" -v
      - run: python -m unittest discover -s artifact/original_execution/portable_ambiguity -p "test_ambiguity.py" -v
      - run: python artifact/original_execution/portable_ambiguity/run_native_controls.py faiss --output "$RUNNER_TEMP/g1-faiss" --authorize-synthetic-native
      - run: python artifact/original_execution/portable_ambiguity/run_native_controls.py hnswlib --transfer-adapter "$GITHUB_WORKSPACE/artifact/original_execution/portable_transfer_100k" --output "$RUNNER_TEMP/g1-hnsw" --authorize-synthetic-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-g1-python-native-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/g1-faiss
            ${{ runner.temp }}/g1-hnsw
  transfer-million-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_graphs/requirements-build.txt
      - run: python -m pip install --no-build-isolation --no-deps -r artifact/original_execution/portable_graphs/requirements-native.txt
      - run: python -m pip install -r artifact/original_execution/portable_truth/requirements.txt scipy==1.13.1
      - run: python -m unittest discover -s artifact/original_execution/portable_transfer_1m -p "test_transfer.py" -v
      - run: python artifact/original_execution/portable_transfer_1m/native_check.py --profiles artifact/original_execution/portable_profiles --output "$RUNNER_TEMP/transfer-million" --authorize-synthetic-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-million-${{ github.event_name }}
          path: ${{ runner.temp }}/transfer-million
  ambiguity-rust-native:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/original_execution/portable_ambiguity/requirements.txt
      - run: rustup toolchain install 1.97.1 --profile minimal --component rust-src && rustup default 1.97.1
      - run: curl --fail --location --max-time 180 https://codeload.github.com/microsoft/DiskANN/tar.gz/158126e64129d3c39f9df02199c2dcc06d4f9e7f -o "$RUNNER_TEMP/g1-source.tar.gz"
      - run: python artifact/original_execution/portable_ambiguity/run_native_controls.py vamana --source-archive "$RUNNER_TEMP/g1-source.tar.gz" --output "$RUNNER_TEMP/g1-rust" --authorize-synthetic-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ambiguity-rust-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/g1-rust/completed.json
            ${{ runner.temp }}/g1-rust/failure.json
            ${{ runner.temp }}/g1-rust/build/build.stdout
            ${{ runner.temp }}/g1-rust/build/build.stderr
  cost-component-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s artifact/original_execution/portable_costs -p "test_components.py" -v
      - run: python artifact/original_execution/portable_costs/components.py --output "$RUNNER_TEMP/cost-components"
