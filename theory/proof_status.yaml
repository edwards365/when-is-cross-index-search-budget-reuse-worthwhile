claims:
  cut_space_projection:
    proposition: P is the weighted cut-space projector, diag(P)=tau, and sum(tau)=N-1.
    status: rederived_verified
    assumptions: connected undirected positive-weight graph
    source: Spielman--Srivastava 2011, Lemma 3
    proof_file: theory/known_results.md#k1-weighted-cut-space-projection-and-foster-identity
    numerical_test: tests/python/test_effective_resistance.py::test_laplacian_and_projection_identities
    counterexample: null
    experiment_link: local leverage normalization audit
    last_updated: 2026-08-22
  bridge_iff_unit_leverage:
    proposition: An existing edge is a bridge if and only if tau_e=1.
    status: rederived_verified
    assumptions: connected undirected positive-weight graph
    source: classical Thomson/Rayleigh consequence
    proof_file: theory/known_results.md#k2-bounds-and-bridge-equivalence
    numerical_test: tests/python/test_effective_resistance.py::test_known_graph_resistances_and_leverages
    counterexample: null
    experiment_link: bridge-retention rate
    last_updated: 2026-08-22
  spanning_tree_marginal:
    proposition: Weighted random spanning-tree edge marginal equals tau_e.
    status: imported_verified
    assumptions: connected undirected positive-weight graph; product-of-weights tree law
    source: matrix-tree/transfer-current identity
    proof_file: theory/known_results.md#k3-weighted-random-spanning-tree-marginal
    numerical_test: tests/python/test_effective_resistance.py::test_weighted_spanning_tree_marginals_equal_leverages
    counterexample: null
    experiment_link: optional tree-sampling proxy calibration
    last_updated: 2026-08-22
  local_resistance_upper_bound:
    proposition: A connected conductance-preserving subgraph overestimates terminal resistance.
    status: rederived_verified
    assumptions: undirected graphs; same terminal vertices; subgraph remains connected
    source: Rayleigh monotonicity
    proof_file: theory/known_results.md#k4-rayleigh-monotonicity-and-local-bias
    numerical_test: tests/python/test_counterexamples.py::test_local_reference_graph_can_overestimate_global_resistance
    counterexample: theory/counterexamples.md#c4-local-overestimation
    experiment_link: one-hop versus two-hop rank distortion
    last_updated: 2026-08-22
  local_rank_control_from_radius:
    proposition: Expanding a local graph by one hop controls global leverage ranking error.
    status: disproved
    assumptions: no spectral or Schur-complement approximation assumption
    source: project counterexample
    proof_file: null
    numerical_test: tests/python/test_counterexamples.py::test_local_reference_graph_can_overestimate_global_resistance
    counterexample: theory/counterexamples.md#c4-local-overestimation
