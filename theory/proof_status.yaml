  spectral_resistance_stability:
    proposition: Common-kernel epsilon spectral approximation yields reciprocal multiplicative resistance bounds.
    status: project_proved
    assumptions: common kernel span(1); 0<=epsilon<1
    source: inversion on the positive-definite restriction
    proof_file: theory/known_results.md#k5-spectral-approximation-and-resistance-stability
    numerical_test: tests/python/test_effective_resistance.py
    counterexample: null
    experiment_link: leverage rank stability under local-graph perturbation
    last_updated: 2026-08-22
  spectral_approximation_implies_navigation:
    proposition: Spectral approximation alone preserves greedy ANN paths or recall.
    status: disproved
    assumptions: navigation treats positive-weight edges as adjacency regardless of conductance
    source: project counterexample family
    proof_file: null
    numerical_test: tests/python/test_counterexamples.py::test_tiny_conductance_edge_can_change_unweighted_navigation
    counterexample: theory/counterexamples.md#c3-spectral-closeness-does-not-preserve-greedy-navigation
    experiment_link: weighted spectral error versus trace divergence
    last_updated: 2026-08-22
  direction_logdet_submodular:
    proposition: Regularized direction log-det is normalized monotone submodular.
    status: rederived_verified
    assumptions: sigma>0; fixed nonzero direction vectors
    source: determinant lemma and Loewner inversion; consistent with Krause et al. 2008
    proof_file: theory/known_results.md#k7-direction-log-determinant
    numerical_test: tests/python/test_submodularity.py::test_direction_logdet_is_normalized_monotone_submodular
    counterexample: null
    experiment_link: logged direction marginal and Gram condition number
    last_updated: 2026-08-22
  frozen_local_greedy_factor:
    proposition: Frozen DLS greedy has a 1-1/e approximation for the declared combined objective.
    status: rederived_verified
    assumptions: fixed ground set and scores; nonnegative coefficients; cardinality budget
    source: Nemhauser--Wolsey--Fisher 1978
    proof_file: theory/known_results.md#k8-frozen-combined-objective-and-greedy-approximation
    numerical_test: tests/python/test_submodularity.py::test_frozen_combination_is_submodular
    counterexample: null
    experiment_link: greedy objective gap on enumerably small candidate sets
    last_updated: 2026-08-22
  global_hnsw_greedy_factor:
    proposition: The local 1-1/e factor applies to reciprocal HNSW construction with reverse pruning.
    status: disproved
    assumptions: real construction couples local budgets
    source: model mismatch
    proof_file: theory/local_global_models.md
