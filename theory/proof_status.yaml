    counterexample: shared degree capacity can invalidate independent local optima
    experiment_link: DLS versus SLR objective loss
    last_updated: 2026-08-22
  dynamic_leverage_submodular:
    proposition: Sum of selected edges' recomputed leverages is submodular.
    status: disproved
    assumptions: F_dyn(S)=sum_{e in S} tau_e^(H0+S)
    source: project exhaustive enumeration
    proof_file: theory/counterexamples.md#c6-dynamic-leverage-is-not-generally-submodular
    numerical_test: tests/python/test_submodularity.py::test_declared_dynamic_leverage_objective_is_not_submodular
    counterexample: n=5 tree plus three candidate edges; emitted by theory.search_counterexamples
    experiment_link: frozen versus dynamic selection divergence
    last_updated: 2026-08-22
  bridge_retention_candidate_a:
